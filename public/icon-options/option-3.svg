          <stop offset="0%" stop-color="#008060"/>
          <stop offset="100%" stop-color="#005e46"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="110" fill="url(#bg3)"/>
      <!-- Iconic 'D' Monogram Clock -->
