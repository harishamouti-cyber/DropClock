      <path d="M133 72 C133 72 110 98 110 114 C110 126 120 136 133 136 C146 136 156 126 156 114 C156 98 133 72 133 72 Z" fill="#6ee7b7"/>
      <!-- Curved D Semi-Circle Arc acting as Clock Dial -->
