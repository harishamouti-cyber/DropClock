# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "88689745373b37439f8a9885c878251c"
name = "DropClock"
handle = "dropclock"
application_url = "https://drop-clock-zeta.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "dropclock-dev.myshopify.com"

[access_scopes]
# Minimal Scope Strategy: strictly necessary scopes, zero Protected Customer Data (PCD)
scopes = "read_products,write_products"

[auth]
redirect_urls = [
  "https://drop-clock-zeta.vercel.app/auth/callback",
  "https://drop-clock-zeta.vercel.app/auth/shopify/callback",
  "https://drop-clock-zeta.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[webhooks.privacy_compliance]
customer_data_request_url = "/webhooks/gdpr/data-request"
customer_deletion_url = "/webhooks/gdpr/customer-deletion"
shop_deletion_url = "/webhooks/gdpr/shop-deletion"

[pos]
embedded = false
