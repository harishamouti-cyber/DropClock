# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0a616a9e934ece36ebebdfd0bb906a9b"
name = "DropClock"
handle = "dropclock"
application_url = "https://drop-clock-zeta.vercel.app"
embedded = true

# Official App Icon Asset: assets/app-icon.png (1200x1200px / 512x512px)
# Accessible via https://drop-clock-zeta.vercel.app/app-icon.png

[build]
automatically_update_urls_on_dev = false
dev_store_url = "rankpilot-xk8wrvgu.myshopify.com"

[access_scopes]
# Minimal Scope Strategy: strictly necessary scopes, zero Protected Customer Data (PCD)
scopes = "read_products,write_products"

[auth]
redirect_urls = [
  "https://drop-clock-zeta.vercel.app/auth/callback",
  "https://drop-clock-zeta.vercel.app/auth/shopify/callback",
  "https://drop-clock-zeta.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[webhooks.privacy_compliance]
customer_data_request_url = "/webhooks/gdpr/data-request"
customer_deletion_url = "/webhooks/gdpr/customer-deletion"
shop_deletion_url = "/webhooks/gdpr/shop-deletion"

[pos]
embedded = false
